<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synergy Social Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #7c3aed, #e11d48);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 8px #34d399;
    }
    .status-dot.warn {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #e11d48);
      color: #ffffff;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .btn:hover { opacity: 0.92; }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">S</div>
    <div>
      <div class="title">Synergy Social Assistant</div>
    </div>
    <span class="badge" style="margin-left: auto;">v1.0.0</span>
  </div>

  <div class="card">
    <div class="label">Instagram Connection</div>
    <div class="status-row" id="igStatusRow">
      <div id="igStatusText" style="display: flex; align-items: center;">
        <span class="status-dot" id="igDot"></span>
        <span id="igLabel">Checking session...</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Synergy Web Companion</div>
    <div class="status-row">
      <div style="display: flex; align-items: center;">
        <span class="status-dot"></span>
        <span>Bridge Ready (PostMessage)</span>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" id="openIgBtn">Open Instagram</button>
  <button class="btn btn-secondary" id="verifyBtn">Verify Flow Integrity</button>

  <div class="footer">Synergy AI Operations • Residential Browser Automation</div>
  <script src="popup.js"></script>
</body>
</html>
